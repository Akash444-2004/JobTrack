spring.application.name=JobTrack

# Server
server.port=${SERVER_PORT:8080}

# PostgreSQL Database Configuration (via Environment Variables)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jobtrack_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration (override JWT_SECRET in production)
jwt.secret=${JWT_SECRET:JobTrackSuperSecretJwtKeyForLocalDevelopmentMustBeAtLeast256Bits2026!}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
